[package]
authors = ["you"]
description = "A Tauri App"
edition = "2021"
name = "qqnote"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = {version = "2.7.3", features = [] }

[dependencies]
chrono = {version = "0.4.45", features = ["serde"] }
diesel = {version = "2.3.14", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono"] }
diesel_migrations = {version = "2.3.2", features = ["sqlite"] }
dirs = "7"
dotenvy = "0.15.7"
libsqlite3-sys = {version = "0.38.2", features = ["bundled"] }
serde = {version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = {version = "2.12.4", features = [ "objc-exception", "wry"], default-features = false}
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
panic = "abort" # Strip expensive panic clean-up logic
strip = true # Remove debug symbols
